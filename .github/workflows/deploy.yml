name: Deploy ahmadfatayerji.com (Podman Quadlet)

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency: ahmadfatayerji-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://ahmadfatayerji.com' }}
    steps:
      - name: Validate admin configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ADMIN_PASSWORD_HASH" =~ ^scrypt:[a-f0-9]{32}:[a-f0-9]{128}$ ]]; then
            echo "::error::Set ADMIN_PASSWORD_HASH to the scrypt hash generated by npm run admin:password (without the ADMIN_PASSWORD_HASH= prefix)."
            exit 1
          fi
          if [[ ! "$SITE_ORIGIN" =~ ^https://[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?(:[0-9]{1,5})?$ ]]; then
            echo "::error::SITE_ORIGIN must be an HTTPS origin without a path or trailing slash."
            exit 1
          fi

      - name: Deploy via SSH (Podman Quadlet)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ADMIN_PASSWORD_HASH,SITE_ORIGIN
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR=/opt/MyPortfolio
 
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: $APP_DIR is missing a git repo. Clone it once on the server."
              exit 1
            fi

            cd "$APP_DIR"

            # Ensure git can operate even if ownership changed at some point
            git config --global --add safe.directory "$APP_DIR" || true

            # Ensure user systemd bus is reachable in non-interactive SSH
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"

            # Pull latest before running the deploy script (avoid stale paths)
            git fetch --all --prune
            git checkout production
            git pull --ff-only origin production

            # Run deployment (build, restart)
            GIT_PULL=0 bash ops/podman-quadlet-deploy.sh

            # Optional: show status at end (helps Actions logs)
            systemctl --user daemon-reload || true
            systemctl --user status ahmadfatayerji-web --no-pager || true
