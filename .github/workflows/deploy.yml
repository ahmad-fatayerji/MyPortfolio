name: Deploy website

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      # Install dependencies and build the app
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # Deploy to server for SSR (next start)
      - name: Deploy to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # Set up SSH key
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Add the server to known_hosts
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

          # Deploy necessary files to server
          rsync -avz --delete .next/ $SERVER_USER@$SERVER_IP:/var/www/mywebsite/.next/
          rsync -avz public/ $SERVER_USER@$SERVER_IP:/var/www/mywebsite/public/
          rsync -avz package.json $SERVER_USER@$SERVER_IP:/var/www/mywebsite/
          rsync -avz next.config.ts $SERVER_USER@$SERVER_IP:/var/www/mywebsite/
          rsync -avz node_modules/ $SERVER_USER@$SERVER_IP:/var/www/mywebsite/node_modules/

