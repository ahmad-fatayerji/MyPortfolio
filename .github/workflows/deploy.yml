name: Deploy Website (No PM2, No Systemd)

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Deploy and restart on server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # Write private key
          echo "$DEPLOY_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          # Add server to known_hosts
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          echo "📦 Deploying files to server..."

          rsync -az --delete \
            -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            .next public package.json package-lock.json next.config.* \
            $SERVER_USER@$SERVER_IP:/var/www/mywebsite/

          echo "🚀 Restarting app using nohup..."

          ssh -i private_key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
            cd /var/www/mywebsite && \
            pkill -f 'next start' || true && \
            npm install --omit=dev && \
            nohup npm start > out.log 2>&1 &
          "
