name: Deploy website

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Deploy to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$DEPLOY_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh_cmd="ssh -i private_key.pem -o StrictHostKeyChecking=no"
          remote_dir="/var/www/mywebsite"

          echo "📦 Syncing full project to server..."
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            -e "$ssh_cmd" \
            ./ $SERVER_USER@$SERVER_IP:$remote_dir

          echo "🚀 Restarting app on server..."
          $ssh_cmd $SERVER_USER@$SERVER_IP "
            cd $remote_dir && \
            pkill -f 'next start' || true && \
            npm install --omit=dev && \
            npm run build && \
            PORT=3000 nohup npm start > out.log 2>&1 &
          "
