name: Deploy website

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      # Install dependencies and build the app
      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      # Deploy production-ready build to server
      - name: Deploy to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # Set up SSH key
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

          # Deploy only what's needed for `next start`
          rsync -avz --delete .next/ $SERVER_USER@$SERVER_IP:/var/www/mywebsite/.next/
          rsync -avz public/ $SERVER_USER@$SERVER_IP:/var/www/mywebsite/public/
          rsync -avz node_modules/ $SERVER_USER@$SERVER_IP:/var/www/mywebsite/node_modules/
          rsync -avz package.json $SERVER_USER@$SERVER_IP:/var/www/mywebsite/package.json
          rsync -avz next.config.* $SERVER_USER@$SERVER_IP:/var/www/mywebsite/
