name: Deploy Website

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Deploy and restart on server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$DEPLOY_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh_cmd="ssh -i private_key.pem -o StrictHostKeyChecking=no"
          remote_dir="/var/www/mywebsite"

          echo "📦 Syncing files to $SERVER_IP:$remote_dir..."
          rsync -az --delete -e "$ssh_cmd" \
            .next public package*.json next.config.* \
            $SERVER_USER@$SERVER_IP:$remote_dir

          echo "🚀 Restarting app remotely..."
          $ssh_cmd $SERVER_USER@$SERVER_IP "
            cd $remote_dir && \
            pkill -f 'next start' || true && \
            npm install --omit=dev && \
            nohup npm start > out.log 2>&1 &
          "
