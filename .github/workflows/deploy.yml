name: Deploy Website

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install & Build Locally
        run: |
          npm install
          npm run build

      - name: Upload Files to Server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$DEPLOY_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          rsync -avz -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            --exclude node_modules \
            --exclude .git \
            ./ $SERVER_USER@$SERVER_IP:/var/www/mywebsite

      - name: Install & Restart on Server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "
            cd /var/www/mywebsite &&
            npm install &&
            npm run build &&
            pm2 delete my-nextjs-app || true
            pm2 start npm --name 'my-nextjs-app' -- start
            pm2 save
            sudo systemctl restart apache2
          "
