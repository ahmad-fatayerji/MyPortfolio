name: Deploy Website

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Deploy and build on server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$DEPLOY_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          ssh_cmd="ssh -i private_key.pem -o StrictHostKeyChecking=no"
          remote_dir="/var/www/mywebsite"

          echo "📦 Syncing full project to server..."
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".next" \
            -e "$ssh_cmd" \
            ./ $SERVER_USER@$SERVER_IP:$remote_dir

          echo "🚀 Installing, building, and restarting services..."
          $ssh_cmd $SERVER_USER@$SERVER_IP <<EOF
            cd $remote_dir
            pkill -f 'next start' || true
            rm -rf .next
            npm install --omit=dev
            npm run build
            PORT=3000 nohup npm start > out.log 2>&1 &
            sudo systemctl restart apache2
