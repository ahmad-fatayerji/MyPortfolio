name: Deploy website

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Deploy and restart with screen
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts

          echo "📦 Syncing build files to server..."

          rsync -avz --delete \
            .next public package.json package-lock.json next.config.* \
            $SERVER_USER@$SERVER_IP:/var/www/mywebsite/

          echo "🚀 Installing dependencies and restarting with screen..."

          ssh $SERVER_USER@$SERVER_IP "
            cd /var/www/mywebsite && \
            npm install --omit=dev && \
            screen -S mywebsite -X quit || true && \
            screen -dmS mywebsite bash -c 'npm start'
          "
