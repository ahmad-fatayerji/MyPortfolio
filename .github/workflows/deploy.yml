name: Deploy ahmadfatayerji.com (PM2 + rsync)

on:
  push:
    branches: [production]

concurrency: ahmadfatayerji-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install & build (standalone)
        run: |
          set -e
          npm ci
          npm run build
          echo "${GITHUB_SHA} $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > version.txt

      - name: Prepare standalone bundle  ✅ FULL .next + public
        run: |
          set -e
          rm -rf out_standalone
          mkdir -p out_standalone/.next

          # 1) Standalone runtime
          cp -r .next/standalone/* out_standalone/

          # 2) FULL Next build (without cache)
          rsync -a --delete --exclude 'cache/' .next/ out_standalone/.next/

          # 3) Public assets
          [ -d public ] && rsync -a public/ out_standalone/public/

          # Version marker
          cp version.txt out_standalone/

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Upload release via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -e
          RSYNC_DEST="/var/www/ahmadfatayerji.com/releases/${{ github.sha }}/"
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=accept-new" \
            out_standalone/ "${SSH_USER}@${SSH_HOST}:${RSYNC_DEST}"

      - name: Activate release + PM2 restart (node server.js) + wait + prune
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -eo pipefail
            SITE=/var/www/ahmadfatayerji.com
            REL="$SITE/releases/${{ github.sha }}"
            CUR="$SITE/current"
            APP=ahmadfatayerji
            PORT=3000

            # Point current to new release
            ln -sfn "$REL" "$CUR"
            echo "current -> $(readlink -f "$CUR")"

            # Ensure production build metadata exists
            [ -f "$CUR/.next/BUILD_ID" ] || { echo "❌ .next/BUILD_ID missing in release"; ls -la "$CUR/.next"; exit 1; }

            # Pick standalone entry
            if [ -f "$CUR/server.js" ]; then ENTRY="$CUR/server.js";
            elif [ -f "$CUR/.next/standalone/server.js" ]; then ENTRY="$CUR/.next/standalone/server.js";
            else echo "❌ no server.js found"; ls -la "$CUR"; exit 1; fi

            # Restart app with PM2
            pm2 delete "$APP" || true
            PORT="$PORT" HOST="127.0.0.1" NODE_ENV=production \
            pm2 start /usr/bin/node --name "$APP" -- "$ENTRY"
            pm2 save

            # Wait for port to open + HTTP probe
            for i in $(seq 1 60); do ss -ltn | grep -q ":$PORT" && break; sleep 1; done
            ss -ltn | grep -q ":$PORT" || { echo "❌ Port :$PORT not open"; pm2 logs "$APP" --lines 120; exit 1; }
            curl -sfI "http://127.0.0.1:${PORT}" >/dev/null || { echo "❌ HTTP probe failed"; pm2 logs "$APP" --lines 120; exit 1; }

            # Keep only last 5 releases (portable prune)
            KEEP=5
            cd "$SITE/releases" || exit 0
            OLD=$(ls -1t | awk "NR>$KEEP")
            if [ -n "$OLD" ]; then
              echo "Pruning old releases:"
              echo "$OLD" | xargs -r rm -rf
            else
              echo "No old releases to prune."
            fi
